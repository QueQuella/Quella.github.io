<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Personal Odyssey | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景层：手绘沉浸式特效 -->
    <canvas id="sketch-bg"></canvas>

    <!-- 进度指示器 (Ergodic Flow 引导器) -->
    <div class="flow-indicator">
        <div class="line"></div>
        <div class="dot"></div>
    </div>

    <div id="viewport">
        <!-- Section 1: 个人简介 (Intro) -->
        <section class="panel" id="about">
            <div class="inner">
                <h1 class="hand-drawn-text">[Quella] 作品集</h1>
                <div class="bio-card">
                    <p><strong>wx联系方式:W17720585880 </p>
                </div>
            </div>
        </section>

        <!-- Section 2: 3D动画与场景 (3D & Scene) -->
        <!-- Section 2: 3D动画与场景设计 -->
<section class="panel" id="scene-3d">
    <div class="inner">
        <h2 class="section-title">3D场景展示</h2>
        
        <div class="sketch-grid">
            <!-- 大图：主推作品 -->
            <div class="grid-item large">
                <img src="assets/cave2.png" alt="Cave Scene">
                <span class="caption">#01 Cave Concept</span>
            </div>
            
            <!-- 中图 -->
            <div class="grid-item medium">
                <img src="assets/snow.png" alt="Snow Scene">
                <span class="caption">#02 Winter simulation</span>
            </div>
            
            <!-- 小图 A -->
            <div class="grid-item small">
                <img src="assets/gufeng.jpg" alt="Ancient Scene">
                <span class="caption">#03 Ancient Architecture</span>
            </div>
            
            <!-- 小图 B (注意文件名中的空格处理) -->
            <div class="grid-item small">
                <img src="assets/fansy%20door.png" alt="Fantasy Door">
                <span class="caption">#04 The Gate</span>
            </div>
        </div>
    </div>
</section>
        

        <!-- Section 3: 游戏设计 (Game/UE/Unity) -->
        <section class="panel" id="game">
            <div class="inner">
                <h2 class="section-title">游戏设计视频</h2>
                <div class="video-placeholder">
                    <div class="play-icon">▶</div>
                    <span>[ 这里嵌入 UE/Unity 特效视频链接 ]</span>
                </div>
            </div>
        </section>

        <!-- Section 4: 平面与手绘 (Graphic & Hand-drawn) -->
        <section class="panel" id="hand-drawn">
            <div class="inner center">
                <h2 class="section-title">手绘沉浸特效</h2>
                <div class="sketch-gallery">
                    <div class="sketch-item">手稿 A</div>
                    <div class="sketch-item">手稿 B</div>
                </div>
            </div>
        </section>

        <!-- Section 5: 探索 (Explore) -->
        <section class="panel" id="explore">
            <div class="inner">
                <h2 class="section-title">探索 / 未来</h2>
                <p>不断打破边界，寻找新的视觉语言。</p>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
